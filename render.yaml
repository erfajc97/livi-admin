# Render Blueprint — LIVI Admin (panel Vite + React, sitio estático)
# https://render.com/docs/blueprint-spec
#
# Uso: Render → New → Blueprint → repo livi-admin.
# VITE_API_BASE_URL debe apuntar al servicio livi-api desplegado
# (https://livi-api.onrender.com/api) o al dominio propio (https://api.livi.ec/api).
#
# Dominio: cuando compren el dominio → Settings → Custom Domain (ej. admin.livi.ec).

services:
  - type: web
    name: livi-admin
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false # https://livi-api.onrender.com/api (TODO dominio propio)
    # SPA fallback para el router de React
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
